[project]
name = "jev-open"
version = "0.2.2"
description = "Especialista classificador local: o modelo observa, o código decide, a incerteza vira revisão."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml",
    "numpy",
]

[dependency-groups]
# Treino e avaliação (GB10/GPU). A VPS não precisa deste grupo: ela serve via ONNX (fase 6).
train = [
    "torch>=2.10",
    "transformers>=4.48,<5",
    "sentencepiece",
    "protobuf",
    "tiktoken",
    "safetensors",
    "scikit-learn",
    "huggingface_hub",
]

[tool.uv]
default-groups = ["train"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }
